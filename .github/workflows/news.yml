name: 아침 랭킹뉴스 발송

on:
  schedule:
    - cron: '17 21 * * *'   # UTC 21:17 = 한국시간 06:17
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼 (테스트용)

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install requests beautifulsoup4

      - name: 뉴스 발송
        run: python main.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
# schedule refresh
